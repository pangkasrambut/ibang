    const API_URL = 'https://script.google.com/macros/s/AKfycbzmHKAhSuklmm0tfTSQqp8JenbVGXwYVKPmngyQey1rx7vknyOBot8LFC45Twy26gPjDQ/exec';

    (function() {
        const LAYANAN_MASTER = [
            { id: 'pr', nama: 'Potong Rambut', harga: 30000 },
            { id: 'srph', nama: 'Semir Rambut Pendek Hitam', harga: 120000 },
            { id: 'srph_panjang', nama: 'Semir Rambut Panjang Hitam', harga: 150000 },
            { id: 'srpw', nama: 'Semir Rambut Pendek Warna', harga: 120000 },
            { id: 'srpw_panjang', nama: 'Semir Rambut Panjang Warna', harga: 150000 },

        let layananDipilihModal = [];

        let filterBarbermanValue = '';
        let filterTanggalValue = '';

        const tabsLogin = document.querySelectorAll('.tab-login');

        const loginRoleSelector = document.getElementById('loginRoleSelector');
        const loginFieldsContainer = document.getElementById('loginFieldsContainer');

        const regNamaOperator = document.getElementById('regNamaOperator');
        const btnRegister = document.getElementById('btnRegister');
        const apiStatusLogin = document.getElementById('apiStatusLogin');
        const apiStatusApp = document.getElementById('apiStatusApp');
        const apiStatusSetting = document.getElementById('apiStatusSetting');

        const btnLogout = document.getElementById('btnLogout');

        const elCctvSelesai = document.getElementById('cctvSelesai');
        const elCctvTanggal = document.getElementById('cctvTanggal');
        const btnTambahCctv = document.getElementById('btnTambahCctv');
        const notaListContainer = document.getElementById('notaListContainer');
        const cctvListContainer = document.getElementById('cctvListContainer');
        const notaCount = document.getElementById('notaCount');
        const cctvCount = document.getElementById('cctvCount');
        const btnMulai = document.getElementById('btnMulai');
        const btnSelesai = document.getElementById('btnSelesai');
        const clockStatus = document.getElementById('clockStatus');
        const jamMulaiDisplay = document.getElementById('jamMulaiDisplay');
        const jamSelesaiDisplay = document.getElementById('jamSelesaiDisplay');

        const modalLayanan = document.getElementById('modalLayanan');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalJamMulai = document.getElementById('modalJamMulai');
        const modalJamSelesai = document.getElementById('modalJamSelesai');
        const modalDurasi = document.getElementById('modalDurasi');
        const modalBarbermanName = document.getElementById('modalBarbermanName');
        const modalNamaPelanggan = document.getElementById('modalNamaPelanggan');
        const modalLayananGrid = document.getElementById('modalLayananGrid');
        const modalTotal = document.getElementById('modalTotal');
        const modalJumlahLayanan = document.getElementById('modalJumlahLayanan');
        const namaError = document.getElementById('namaError');
        const btnOkLayanan = document.getElementById('btnOkLayanan');

        const modalCetak = document.getElementById('modalCetak');
        const modalCetakClose = document.getElementById('modalCetakClose');
        const btnPrint = document.getElementById('btnPrint');
        const btnTutupCetak = document.getElementById('btnTutupCetak');
        const notaPreviewWrapper = document.getElementById('notaPreviewWrapper');

        const laporanBody = document.getElementById('laporanBody');
        const laporanMobileContainer = document.getElementById('laporanMobileContainer');
        const totalPendapatan = document.getElementById('totalPendapatan');
        const totalTransaksi = document.getElementById('totalTransaksi');
        const totalCocok = document.getElementById('totalCocok');
        const totalTidakCocok = document.getElementById('totalTidakCocok');

        const filterBar = document.getElementById('filterBar');
        const filterBarberman = document.getElementById('filterBarberman');
        const filterTanggal = document.getElementById('filterTanggal');
        const btnResetFilter = document.getElementById('btnResetFilter');
        const rekapBarbermanSection = document.getElementById('rekapBarbermanSection');
        const rekapBarbermanContainer = document.getElementById('rekapBarbermanContainer');

        // Keuangan
        const keuJenis = document.getElementById('keuJenis');
        const keuKategori = document.getElementById('keuKategori');
        const keuJumlah = document.getElementById('keuJumlah');
        const keuKeterangan = document.getElementById('keuKeterangan');
        const keuTanggal = document.getElementById('keuTanggal');
        const keuMetode = document.getElementById('keuMetode');
        const btnTambahKeuangan = document.getElementById('btnTambahKeuangan');
        const keuanganListContainer = document.getElementById('keuanganListContainer');
        const keuanganCount = document.getElementById('keuanganCount');
        const saldoKasValue = document.getElementById('saldoKasValue');
        const saldoMasuk = document.getElementById('saldoMasuk');
        const saldoKeluar = document.getElementById('saldoKeluar');
        const filterKeuTanggal = document.getElementById('filterKeuTanggal');
        const filterKeuJenis = document.getElementById('filterKeuJenis');
        const btnResetFilterKeu = document.getElementById('btnResetFilterKeu');

        // User management
        const shopNama = document.getElementById('shopNama');
        const shopAlamat = document.getElementById('shopAlamat');
        const shopHP = document.getElementById('shopHP');
        const btnSimpanShop = document.getElementById('btnSimpanShop');
        const userListContainer = document.getElementById('userListContainer');
        const userCount = document.getElementById('userCount');
        const navUser = document.getElementById('navUser');

        // Setting
        const setOldPass = document.getElementById('setOldPass');
        const setNewPass = document.getElementById('setNewPass');
        const setConfirmPass = document.getElementById('setConfirmPass');
        const btnGantiPassword = document.getElementById('btnGantiPassword');
        const settingUserInfo = document.getElementById('settingUserInfo');

        // Dashboard
        const dashPendapatanHari = document.getElementById('dashPendapatanHari');
        const dashPendapatanHariCount = document.getElementById('dashPendapatanHariCount');
        const dashPendapatanBulan = document.getElementById('dashPendapatanBulan');
        const dashPendapatanBulanCount = document.getElementById('dashPendapatanBulanCount');
        const dashSaldoKas = document.getElementById('dashSaldoKas');
        const dashTotalNota = document.getElementById('dashTotalNota');
        const dashChart7Hari = document.getElementById('dashChart7Hari');
        const dashTopOperator = document.getElementById('dashTopOperator');
        const dashNotaTerbaru = document.getElementById('dashNotaTerbaru');

        // ============ TOGGLE PASSWORD ============
        document.querySelectorAll('.toggle-password').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;
                if (input.type === 'password') {
                    input.type = 'text'; btn.textContent = '🙈';
                } else {
                    input.type = 'password'; btn.textContent = '👁️';
                }
                input.focus();
            });
        });

        // ============ HELPERS ============
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        }
        function timeToMinutes(t) {
            if (!t) return 0;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }
        function hitungSelisihMenit(a, b) { return Math.abs(timeToMinutes(a) - timeToMinutes(b)); }
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function getJamSekarang() {
            const d = new Date();
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }
        function getTanggalSekarang() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function getTanggalFormatted(tgl) {
            if (!tgl) return '-';
            const [y, m, d] = tgl.split('-');
            return `${d}/${m}/${y}`;
        }
        function getHariFormatted(tgl) {
            const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const d = new Date(tgl);
            return hari[d.getDay()] || '-';
        }
        function getLayananById(id) { return LAYANAN_MASTER.find(l => l.id === id); }
        function hitungTotalLayanan(ids) {
            return ids.reduce((sum, id) => {
                const l = getLayananById(id);
                return sum + (l ? l.harga : 0);
            }, 0);
        }
        function showAlert(message, type) {
            authAlert.className = 'alert-box alert-' + type + ' show';
            authAlert.innerHTML = message;
            setTimeout(() => { authAlert.className = 'alert-box'; }, 5000);
        }
        function hideAlert() { authAlert.className = 'alert-box'; authAlert.innerHTML = ''; }

        // ============ STORAGE ============
        function loadAuth() {
            try { const raw = localStorage.getItem(AUTH_KEY); if (raw) currentUser = JSON.parse(raw); } catch(e) { currentUser = null; }
        }
        function saveAuth() {
            if (currentUser) localStorage.setItem(AUTH_KEY, JSON.stringify(currentUser));
            else localStorage.removeItem(AUTH_KEY);
        }
        function loadKeuangan() {
            try { const raw = localStorage.getItem(KEKEUANGAN_KEY); if (raw) keuanganList = JSON.parse(raw); } catch(e) { keuanganList = []; }
        }
        function saveKeuangan() { localStorage.setItem(KEKEUANGAN_KEY, JSON.stringify(keuanganList)); }
        function loadShopProfile() {
            try {
                const raw = localStorage.getItem(SHOP_KEY);
                if (raw) shopProfile = JSON.parse(raw);
            } catch(e) {}
            applyShopProfile();
        }
        function saveShopProfile() {
            localStorage.setItem(SHOP_KEY, JSON.stringify(shopProfile));
            applyShopProfile();
        }
        function applyShopProfile() {
            loginShopName.textContent = shopProfile.nama || 'Barbershop';
            if (shopNama) shopNama.value = shopProfile.nama || '';
            if (shopAlamat) shopAlamat.value = shopProfile.alamat || '';
            if (shopHP) shopHP.value = shopProfile.hp || '';
        }

        // ============ API ============
        function setApiStatus(state) {
            [apiStatusLogin, apiStatusApp, apiStatusSetting].forEach(el => {
                if (!el) return;
                el.className = 'api-status api-' + state;
                el.textContent = state === 'online' ? '🟢 Online' : state === 'offline' ? '🔴 Offline' : '⏳ Loading...';
            });
        }
        async function apiCall(action, params, method) {
            method = method || 'GET';
            try {
                let url = API_URL;
                let options = { method: method };
                if (method === 'GET') {
                    const qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
                    url += '?' + qs;
                } else {
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                    options.body = JSON.stringify(Object.assign({ action: action }, params || {}));
                }
                const res = await fetch(url, options);
                return await res.json();
            } catch (err) {
                return { ok: false, message: 'Koneksi gagal: ' + err.message };
            }
        }
        async function checkApi() {
            setApiStatus('loading');
            const res = await apiCall('ping');
            apiOnline = !!(res && res.ok);
            setApiStatus(apiOnline ? 'online' : 'offline');
            return apiOnline;
        }

        // ============ LOGIN / REGISTER ============
        function showLoginPage() {
            loginPage.classList.remove('hidden');
            app.classList.add('hidden');
            document.getElementById('bottomNav').style.display = 'none';
            selectedLoginRole = '';
            document.querySelectorAll('#loginRoleSelector .role-option').forEach(el => el.classList.remove('selected'));
            loginFieldsContainer.style.display = 'none';
            loginUsername.value = ''; loginPassword.value = '';
            btnLogin.disabled = true;
            hideAlert();
            switchLoginTab('login');
        }
        function showApp() {
            loginPage.classList.add('hidden');
            app.classList.remove('hidden');
            document.getElementById('bottomNav').style.display = 'grid';
            if (currentUser.role === 'admin') {
                userAvatar.textContent = '👨‍💼';
                userAvatar.classList.add('admin');
                userName.textContent = 'Admin';
                userRole.textContent = 'Administrator';
                subheadText.innerHTML = 'Mode Admin — kelola nota, keuangan, user & setting';
                barberBadge.style.display = 'none';
                filterBar.style.display = 'flex';
                rekapBarbermanSection.style.display = 'block';
                navUser.style.display = 'flex';
            } else {
                userAvatar.textContent = '💈';
                userAvatar.classList.remove('admin');
                userName.textContent = currentUser.namaOperator;
                userRole.textContent = 'Barberman · @' + currentUser.username;
                subheadText.innerHTML = `Login sebagai <b>${escapeHtml(currentUser.namaOperator)}</b>`;
                barberBadge.style.display = 'inline-flex';
                barberBadgeName.textContent = currentUser.namaOperator;
                filterBar.style.display = 'none';
                rekapBarbermanSection.style.display = 'none';
                navUser.style.display = 'none';
            }
            if (settingUserInfo) {
                settingUserInfo.textContent = currentUser.role === 'admin' ? 'Admin' : currentUser.namaOperator + ' (@' + currentUser.username + ')';
            }
            loadSesiFromCache();
            updateClockUI();
            loadKeuangan(); loadShopProfile();
            syncDataFromServer();
            switchTab('nota');
        }

        async function syncDataFromServer() {
            if (!apiOnline) { renderAll(); return; }
            setApiStatus('loading');
            const [notaRes, cctvRes, userRes] = await Promise.all([
                apiCall('getNota', {}, 'GET'),
                apiCall('getCctv', {}, 'GET'),
                apiCall('getUsers', {}, 'GET')
            ]);
            if (notaRes && notaRes.ok) notaList = notaRes.data || [];
            if (cctvRes && cctvRes.ok) cctvList = cctvRes.data || [];
            if (userRes && userRes.ok) userList = userRes.data || [];
            setApiStatus('online');
            renderAll();
        }

        // ============ LOGIN TAB ============
        function switchLoginTab(tab) {
            tabsLogin.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            if (tab === 'login') {
                loginFormContainer.style.display = 'block';
                registerFormContainer.style.display = 'none';
            } else {
                loginFormContainer.style.display = 'none';
                registerFormContainer.style.display = 'block';
            }
            hideAlert();
        }
        tabsLogin.forEach(t => t.addEventListener('click', () => switchLoginTab(t.dataset.tab)));

        loginRoleSelector.querySelectorAll('.role-option').forEach(opt => {
            opt.addEventListener('click', function() {
                loginRoleSelector.querySelectorAll('.role-option').forEach(el => el.classList.remove('selected'));
                opt.classList.add('selected');
                selectedLoginRole = opt.dataset.role;
                loginFieldsContainer.style.display = 'block';
                hideAlert();
                loginUsername.value = ''; loginPassword.value = '';
                validateLoginForm();
                setTimeout(() => loginUsername.focus(), 200);
            });
        });
        function validateLoginForm() {
            const u = loginUsername.value.trim(); const p = loginPassword.value;
            btnLogin.disabled = !(selectedLoginRole && u && p);
        }
        loginUsername.addEventListener('input', validateLoginForm);
        loginPassword.addEventListener('input', validateLoginForm);
        loginPassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !btnLogin.disabled) btnLogin.click();
        });

        btnLogin.addEventListener('click', async function() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value;
            if (!selectedLoginRole) { showAlert('⚠️ Pilih role dulu.', 'error'); return; }
            if (!username || !password) { showAlert('⚠️ Isi username & password.', 'error'); return; }
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span>⏳</span> Memproses...';
            if (!apiOnline) await checkApi();
            if (!apiOnline) {
                showAlert('❌ Server tidak dapat dijangkau.', 'error');
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<span>🔓</span> Login';
                return;
            }
            const res = await apiCall('login', { username, password, role: selectedLoginRole }, 'POST');
            btnLogin.disabled = false;
            btnLogin.innerHTML = '<span>🔓</span> Login';
            if (res && res.ok) {
                currentUser = res.user;
                saveAuth();
                showApp();
            } else {
                showAlert('❌ Username atau password salah.', 'error');
            }
        });

        // Register
        [regUsername, regPassword, regNamaOperator].forEach(el => {
            el.addEventListener('input', function() { el.classList.remove('error'); hideAlert(); });
        });
        btnRegister.addEventListener('click', async function() {
            const username = regUsername.value.trim();
            const password = regPassword.value;
            const namaOperator = regNamaOperator.value.trim();
            if (!username || !password || !namaOperator) { showAlert('⚠️ Semua field wajib diisi.', 'error'); return; }
            if (username.length < 3) { showAlert('⚠️ Username minimal 3 karakter.', 'error'); return; }
            if (password.length < 4) { showAlert('⚠️ Password minimal 4 karakter.', 'error'); return; }
            if (!apiOnline) await checkApi();
            if (!apiOnline) { showAlert('❌ Server tidak dapat dijangkau.', 'error'); return; }
            btnRegister.disabled = true;
            btnRegister.innerHTML = '<span>⏳</span> Mendaftar...';
            const res = await apiCall('register', { username, password, namaOperator }, 'POST');
            btnRegister.disabled = false;
            btnRegister.innerHTML = '<span>📝</span> Daftar Sebagai Barberman';
            if (res && res.ok) {
                showAlert('✅ Registrasi berhasil! Silakan login.', 'success');
                regUsername.value = ''; regPassword.value = ''; regNamaOperator.value = '';
                setTimeout(() => {
                    switchLoginTab('login');
                    const b = loginRoleSelector.querySelector('[data-role="barberman"]');
                    if (b) b.click();
                    loginUsername.value = username;
                    validateLoginForm();
                }, 1200);
            } else {
                showAlert('❌ ' + (res.message || 'Registrasi gagal.'), 'error');
            }
        });

        // ============ LOGOUT ============
        btnLogout.addEventListener('click', function() {
            if (!confirm('Logout dari aplikasi?')) return;
            currentUser = null;
            saveAuth();
            showLoginPage();
        });

        // ============ TAB NAVIGATION ============
        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            const target = document.getElementById('tab-' + tabName);
            if (target) target.classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.toggle('active', n.dataset.tab === tabName);
            });
            // Refresh data saat pindah tab
            if (tabName === 'dashboard') renderDashboard();
            if (tabName === 'keuangan') { renderKeuangan(); updateSaldo(); }
            if (tabName === 'user') renderUserList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const tab = item.dataset.tab;
                if (tab === 'user' && currentUser.role !== 'admin') {
                    alert('Tab User hanya untuk Admin.'); return;
                }
                switchTab(tab);
            });
        });

        // ============ SESI NOTA ============
        function loadSesiFromCache() {
            try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) sesiAktif = JSON.parse(raw); } catch(e) { sesiAktif = null; }
            updateClockUI();
        }
        function saveSesiToCache() {
            if (sesiAktif) localStorage.setItem(STORAGE_KEY, JSON.stringify(sesiAktif));
            else localStorage.removeItem(STORAGE_KEY);
        }
        function updateClockUI() {
            if (sesiAktif && sesiAktif.jamMulai) {
                jamMulaiDisplay.textContent = sesiAktif.jamMulai;
                jamMulaiDisplay.classList.add('active');
                if (sesiAktif.jamSelesai) {
                    jamSelesaiDisplay.textContent = sesiAktif.jamSelesai;
                    jamSelesaiDisplay.classList.add('active');
                    clockStatus.textContent = '✅ Sesi selesai — pilih layanan';
                    clockStatus.className = 'clock-status done';
                    btnMulai.disabled = false; btnSelesai.disabled = true;
                } else {
                    jamSelesaiDisplay.textContent = '--:--';
                    jamSelesaiDisplay.classList.remove('active');
                    clockStatus.textContent = '🟢 Sedang melayani...';
                    clockStatus.className = 'clock-status running';
                    btnMulai.disabled = true; btnSelesai.disabled = false;
                }
            } else {
                jamMulaiDisplay.textContent = '--:--'; jamSelesaiDisplay.textContent = '--:--';
                jamMulaiDisplay.classList.remove('active'); jamSelesaiDisplay.classList.remove('active');
                clockStatus.textContent = '⏸️ Menunggu pelanggan';
                clockStatus.className = 'clock-status';
                btnMulai.disabled = false; btnSelesai.disabled = true;
            }
        }
        btnMulai.addEventListener('click', function() {
            if (currentUser.role !== 'barberman') { alert('Hanya barberman yang bisa memulai sesi.'); return; }
            if (sesiAktif && sesiAktif.jamMulai && !sesiAktif.jamSelesai) { alert('Sesi sedang berjalan.'); return; }
            sesiAktif = { jamMulai: getJamSekarang(), jamSelesai: null, tanggal: getTanggalSekarang(), barberman: currentUser.namaOperator };
            saveSesiToCache(); updateClockUI();
        });
        btnSelesai.addEventListener('click', function() {
            if (!sesiAktif || !sesiAktif.jamMulai) { alert('Belum ada sesi.'); return; }
            sesiAktif.jamSelesai = getJamSekarang();
            saveSesiToCache(); updateClockUI();
            bukaModalLayanan();
        });

        // ============ MODAL LAYANAN ============
        function buildLayananCheckboxes(container, selectedIds, onChange) {
            let html = '';
            LAYANAN_MASTER.forEach(l => {
                const isSel = selectedIds.includes(l.id);
                html += `<div class="layanan-option ${isSel ? 'selected' : ''}" data-id="${l.id}">
                    <div class="checkbox">${isSel ? '✓' : ''}</div>
                    <div class="lo-info"><div class="lo-name">${escapeHtml(l.nama)}</div></div>
                    <div class="lo-price">${formatRupiah(l.harga)}</div>
                </div>`;
            });
            container.innerHTML = html;
            container.querySelectorAll('.layanan-option').forEach(opt => {
                opt.addEventListener('click', function() {
                    const id = opt.dataset.id;
                    const idx = selectedIds.indexOf(id);
                    if (idx > -1) selectedIds.splice(idx, 1); else selectedIds.push(id);
                    opt.classList.toggle('selected');
                    opt.querySelector('.checkbox').textContent = opt.classList.contains('selected') ? '✓' : '';
                    if (onChange) onChange(selectedIds);
                });
            });
        }
        function bukaModalLayanan() {
            if (!sesiAktif || !sesiAktif.jamSelesai) { alert('Sesi belum selesai.'); return; }
            modalJamMulai.textContent = sesiAktif.jamMulai;
            modalJamSelesai.textContent = sesiAktif.jamSelesai;
            modalDurasi.textContent = Math.max(0, timeToMinutes(sesiAktif.jamSelesai) - timeToMinutes(sesiAktif.jamMulai)) + ' mnt';
            modalBarbermanName.textContent = sesiAktif.barberman || '-';

        // ============ CCTV MATCH ============
        function cariCctvMatch(nota) {
            if (!nota.tanggal) return null;
            const kandidat = cctvList.filter(c => c.tanggal === nota.tanggal);
            let best = null, bestScore = Infinity;
            for (let c of kandidat) {
                const maxS = Math.max(hitungSelisihMenit(nota.jamMulai, c.jamMulai), hitungSelisihMenit(nota.jamSelesai, c.jamSelesai));
                if (maxS <= 10 && maxS < bestScore) { bestScore = maxS; best = c; }
            }
            return best;
        }
        function getMatchStatus(nota) {
            if (!nota.tanggal) return { status: 'no-date' };
            const match = cariCctvMatch(nota);
            if (match) {
                const selisih = Math.max(hitungSelisihMenit(nota.jamMulai, match.jamMulai), hitungSelisihMenit(nota.jamSelesai, match.jamSelesai));
                return { status: 'match', matchedCctv: match, selisih };
            }
            const ada = cctvList.some(c => c.tanggal === nota.tanggal);
            return { status: ada ? 'mismatch' : 'no-cctv' };
        }

        function renderLaporan() {
            const filtered = getFilteredNota();
            if (filtered.length === 0) {
                laporanBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem; color:#94a3b8;">Belum ada data</td></tr>`;

            }
            let total = 0, cocok = 0, tidakCocok = 0;
            let rows = '', cards = '';
            const rekap = {};
            [...filtered].reverse().forEach(n => {
                total += Number(n.total) || 0;
                const m = getMatchStatus(n);
                let statusHtml = '', cctvJam = '-';
                if (m.status === 'match') { cocok++; statusHtml = `<span class="match-status match-true">✅ Cocok (${m.selisih}m)</span>`; cctvJam = `${m.matchedCctv.jamMulai}-${m.matchedCctv.jamSelesai}`; }
                else if (m.status === 'mismatch') { tidakCocok++; statusHtml = `<span class="match-status match-false">❌ Tidak Cocok</span>`; }
                else if (m.status === 'no-cctv') { tidakCocok++; statusHtml = `<span class="match-status match-warning">⚠️ Tanpa CCTV</span>`; }
                else { tidakCocok++; statusHtml = `<span class="match-status match-warning">📅 Tgl kosong</span>`; }
                const b = n.barberman || '-';
                if (!rekap[b]) rekap[b] = { total: 0, count: 0 };
                rekap[b].total += Number(n.total) || 0; rekap[b].count += 1;
                const layananStr = n.layanan.map(l => `${l.nama} (${formatRupiah(l.harga)})`).join('<br>');
                const layananMobile = n.layanan.map(l => `<div class="layanan-line"><span>${escapeHtml(l.nama)}</span><span class="price">${formatRupiah(l.harga)}</span></div>`).join('');
                rows += `<tr>

            if (currentUser && currentUser.role === 'admin') {
                const entries = Object.entries(rekap).sort((a,b) => b[1].total - a[1].total);
                rekapBarbermanContainer.innerHTML = entries.length === 0
                    ? '<div class="empty-state">Belum ada data</div>'

        // ============ DASHBOARD ============
        function renderDashboard() {
            const today = getTanggalSekarang();
            const thisMonth = today.substring(0, 7);
            let totalHari = 0, countHari = 0, totalBulan = 0, countBulan = 0;
            const rekap7Hari = {};
            const rekapOperator = {};
            // Data 7 hari terakhir
            for (let i = 6; i >= 0; i--) {
                const d = new Date(); d.setDate(d.getDate() - i);
                const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                rekap7Hari[key] = 0;
            }
            notaList.forEach(n => {
                const tgl = n.tanggal || '';
                const total = Number(n.total) || 0;
                if (tgl === today) { totalHari += total; countHari++; }
                if (tgl.startsWith(thisMonth)) { totalBulan += total; countBulan++; }
                if (rekap7Hari[tgl] !== undefined) rekap7Hari[tgl] += total;
                const b = n.barberman || '-';
                if (!rekapOperator[b]) rekapOperator[b] = { total: 0, count: 0 };
                rekapOperator[b].total += total; rekapOperator[b].count++;
            });
            dashPendapatanHari.textContent = formatRupiah(totalHari);
            dashPendapatanHariCount.textContent = countHari + ' transaksi';
            dashPendapatanBulan.textContent = formatRupiah(totalBulan);
            dashPendapatanBulanCount.textContent = countBulan + ' transaksi';
            dashTotalNota.textContent = notaList.length;
            // Saldo kas
            const totalMasuk = keuanganList.filter(k => k.jenis === 'masuk').reduce((s,k) => s + Number(k.jumlah||0), 0);
            const totalKeluar = keuanganList.filter(k => k.jenis === 'keluar').reduce((s,k) => s + Number(k.jumlah||0), 0);
            const saldo = totalMasuk - totalKeluar + (currentUser && currentUser.role === 'admin' ? 0 : 0);
            // Saldo juga termasuk pendapatan nota
            const totalNotaAll = notaList.reduce((s,n) => s + Number(n.total||0), 0);
            dashSaldoKas.textContent = formatRupiah(totalMasuk + totalNotaAll - totalKeluar);

            // Chart 7 hari
            const maxVal = Math.max(...Object.values(rekap7Hari), 1);
            let chartHtml = '';
            Object.entries(rekap7Hari).forEach(([tgl, val]) => {
                const hari = getHariFormatted(tgl);
                const pct = (val / maxVal) * 100;
                chartHtml += `<div class="chart-bar-row">
                    <div class="chart-bar-label">${hari}</div>
                    <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%"></div></div>
                    <div class="chart-bar-value">${formatRupiah(val)}</div>
                </div>`;
            });
            dashChart7Hari.innerHTML = chartHtml || '<div class="empty-state">Belum ada data</div>';

            // Top operator
            const ops = Object.entries(rekapOperator).sort((a,b) => b[1].total - a[1].total).slice(0, 5);
            const maxOp = ops.length > 0 ? ops[0][1].total : 1;
            dashTopOperator.innerHTML = ops.length === 0 ? '<div class="empty-state">Belum ada data</div>' :
                ops.map(([nama, d]) => {
                    const pct = (d.total / maxOp) * 100;
                    return `<div class="chart-bar-row">
                        <div class="chart-bar-label">💈 ${escapeHtml(nama).slice(0,12)}</div>
                        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%"></div></div>
                        <div class="chart-bar-value">${formatRupiah(d.total)}</div>
                    </div>`;
                }).join('');

            // Nota terbaru
            const terbaru = [...notaList].reverse().slice(0, 5);
            dashNotaTerbaru.innerHTML = terbaru.length === 0 ? '<div class="empty-state">Belum ada nota</div>' :
                terbaru.map(n => `
                    <div class="cctv-item" style="border-left-color:#f59e0b; background:#fffbeb;">
                        <div class="info">
                            <span class="name">${escapeHtml(n.nama)}</span>
                            <div class="detail">
                                <span>💈 ${escapeHtml(n.barberman || '-')}</span>
                                <span>${n.jamMulai}-${n.jamSelesai}</span>
                                <span>📅 ${n.tanggal}</span>
                            </div>
                        </div>
                        <strong style="color:#f59e0b; white-space:nowrap;">${formatRupiah(n.total)}</strong>
                    </div>`).join('');
        }

        filterKeuTanggal.addEventListener('change', function() { filterKeuTanggalValue = filterKeuTanggal.value; renderKeuangan(); });
        filterKeuJenis.addEventListener('change', function() { filterKeuJenisValue = filterKeuJenis.value; renderKeuangan(); });

        });

        // ============ USER MANAGEMENT ============
        function renderUserList() {
            if (currentUser.role !== 'admin') return;
            if (userList.length === 0) {
                userListContainer.innerHTML = '<div class="empty-state">Belum ada data user.</div>';
                userCount.textContent = '0 user'; return;
            }
            userCount.textContent = userList.length + ' user';
            let html = '';
            userList.forEach(u => {
                const isAktif = u.aktif !== false;
                const isAdmin = u.role === 'admin';
                html += `<div class="user-row">
                    <div class="ur-info">
                        <div class="ur-name">${isAdmin ? '👨‍💼' : '💈'} ${escapeHtml(u.namaOperator || u.username)}</div>
                        <div class="ur-detail">@${escapeHtml(u.username)} · ${isAdmin ? 'Admin' : 'Barberman'} · ${isAktif ? '🟢 Aktif' : '🔴 Nonaktif'}</div>
                    </div>
                    <div class="ur-actions">
                        <button class="btn-mini" onclick="editNamaUser('${escapeHtml(u.username)}')" title="Ubah nama">✏️</button>
                        ${isAdmin ? '<span class="badge badge-blue">Admin</span>' :
                            `<button class="toggle-switch ${isAktif ? 'active' : ''}" onclick="toggleAktifUser('${escapeHtml(u.username)}')" title="${isAktif ? 'Nonaktifkan' : 'Aktifkan'}"></button>`}
                    </div>
                </div>`;
            });
            userListContainer.innerHTML = html;
        }
        window.toggleAktifUser = function(username) {
            if (currentUser.role !== 'admin') { alert('Hanya admin.'); return; }
            const u = userList.find(x => x.username === username);
            if (!u) return;
            u.aktif = u.aktif === false ? true : false;
            renderUserList();
            if (apiOnline) apiCall('updateUser', { username: u.username, aktif: u.aktif }, 'POST');
        };
        window.editNamaUser = function(username) {
            if (currentUser.role !== 'admin') { alert('Hanya admin.'); return; }
            const u = userList.find(x => x.username === username);
            if (!u) return;
            const newName = prompt('Nama operator baru:', u.namaOperator || u.username);
            if (newName === null || !newName.trim()) return;
            u.namaOperator = newName.trim();
            renderUserList();
            if (apiOnline) apiCall('updateUser', { username: u.username, namaOperator: u.namaOperator }, 'POST');
        };
        btnSimpanShop.addEventListener('click', function() {
            const nama = shopNama.value.trim();
            if (!nama) { alert('Nama barbershop wajib diisi.'); return; }
            shopProfile.nama = nama;
            shopProfile.alamat = shopAlamat.value.trim();
            shopProfile.hp = shopHP.value.trim();
            saveShopProfile();
            if (apiOnline) apiCall('updateShopProfile', shopProfile, 'POST');
            alert('✅ Profil barbershop berhasil disimpan!');
        });

        // ============ SETTING ============
        btnGantiPassword.addEventListener('click', async function() {
            const oldPass = setOldPass.value;
            const newPass = setNewPass.value;
            const confirmPass = setConfirmPass.value;
            if (!oldPass || !newPass || !confirmPass) { alert('Semua field wajib diisi.'); return; }
            if (newPass.length < 4) { alert('Password baru minimal 4 karakter.'); return; }
            if (newPass !== confirmPass) { alert('Konfirmasi password tidak sama.'); return; }
            if (!apiOnline) await checkApi();
            if (!apiOnline) { alert('Server tidak dapat dijangkau.'); return; }
            btnGantiPassword.disabled = true;
            btnGantiPassword.innerHTML = '<span>⏳</span> Menyimpan...';
            const res = await apiCall('changePassword', {
                username: currentUser.username,
                oldPassword: oldPass,
                newPassword: newPass
            }, 'POST');
            btnGantiPassword.disabled = false;
            btnGantiPassword.innerHTML = '<span>🔐</span> Simpan Password Baru';
            if (res && res.ok) {
                alert('✅ Password berhasil diubah!');
                setOldPass.value = ''; setNewPass.value = ''; setConfirmPass.value = '';
            } else {
                alert('❌ ' + (res.message || 'Gagal ganti password.'));
            }
        });

        // ============ CCTV ============
        btnTambahCctv.addEventListener('click', async function() {
            const nama = elCctvNama.value.trim();
            const jamMulai = elCctvMulai.value;
            const jamSelesai = elCctvSelesai.value;
            const tanggal = elCctvTanggal.value;
            if (!nama || !jamMulai || !jamSelesai || !tanggal) { alert('Semua field CCTV wajib diisi.'); return; }
            if (timeToMinutes(jamMulai) >= timeToMinutes(jamSelesai)) { alert('Jam selesai harus > jam mulai.'); return; }
            const cctvBaru = { id: 'cctv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6), nama, jamMulai, jamSelesai, tanggal };
            cctvList.push(cctvBaru);
            elCctvNama.value = '';
            renderCctvList(); renderLaporan();
            if (apiOnline) apiCall('addCctv', cctvBaru, 'POST');
        });

        // ============ DELETE ============
        window.deleteNota = async function(id) {
            if (currentUser.role !== 'admin') { alert('Hanya admin.'); return; }
            if (!confirm('Hapus nota ini?')) return;
            notaList = notaList.filter(n => n.id !== id);
            renderAll();
            if (apiOnline) apiCall('deleteNota', { id }, 'POST');
        };
        window.deleteCctv = async function(id) {
            if (!confirm('Hapus CCTV ini?')) return;
            cctvList = cctvList.filter(c => c.id !== id);
            renderAll();
            if (apiOnline) apiCall('deleteCctv', { id }, 'POST');
        };
        window.cetakNotaById = function(id) {
            const nota = notaList.find(n => n.id === id);
            if (nota) bukaModalCetak(nota);
        };

        // ============ RENDER ALL ============
        function renderAll() {
            updateFilterBarbermanOptions();
            renderNotaList();
            renderCctvList();
            renderLaporan();
            renderDashboard();
        }

        // ============ INIT ============
        const today = getTanggalSekarang();
        elCctvTanggal.value = today;
        keuTanggal.value = today;

        loadAuth(); loadKeuangan(); loadShopProfile();
        checkApi().then(() => {
            if (currentUser) {
                // Cek user masih aktif
                if (currentUser.role === 'barberman') {
                    // akan divalidasi di server saat load
                }
                showApp();
            } else {
                showLoginPage();
            }
        });
        setInterval(checkApi, 60000);
    })();
</script>
</body>
</html>
